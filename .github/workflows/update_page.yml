name: 更新网页数据并部署

# 每个交易日北京时间 16:05 (UTC 08:05) 更新 data.json 并部署到 GitHub Pages
# 非交易日脚本生成的 data.json 变化仅时间戳, 部署内容不变, 无副作用
on:
  schedule:
    - cron: '5 8 * * 1-5'   # 北京周一~周五 16:05
  workflow_dispatch:        # 允许手动触发(测试)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}  # 检到分支而非 detached HEAD, 否则 commit 后 push 失败

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成 data.json (东财优先, 腾讯备用)
        run: python generate_data.py

      - name: 提交更新的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: 每日数据更新 $(date -u +%F)"
          git push

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
