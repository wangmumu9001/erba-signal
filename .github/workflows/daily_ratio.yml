name: 二八择时日报

# 触发方式(两条并存, 靠幂等去重保证同一交易日只发一封):
#   1) 外部定时器(主力) —— 交易日北京 16:00 调 workflow_dispatch, 秒级启动, 时间精确
#   2) 兜底 schedule —— GitHub 自带定时有数小时延迟, 仅作外部定时器失效时的备份
#
# 数据口径: 只发"当天"的收盘K线。北京时间 15:10 前, 或最新K线还不是今天,
#           脚本一律不发; 重复触发由 sent_dates.txt 幂等去重拦下。
on:
  schedule:
    # GitHub 的 cron 会推迟数小时才启动(实测 1h48m~6h11m, 且每天不同)。
    # 阶梯从北京 12:10 排到 20:10, 推迟后的落点铺满收盘后的时间窗;
    # 落在 15:10 前的由脚本闸门丢弃, 第一个落进窗口的把信发出去, 其余靠去重跳过。
    - cron: '10 4 * * 1-5'    # 北京 12:10
    - cron: '40 5 * * 1-5'    # 北京 13:40
    - cron: '10 7 * * 1-5'    # 北京 15:10 (无延迟时正好收盘后)
    - cron: '40 8 * * 1-5'    # 北京 16:40
    - cron: '10 10 * * 1-5'   # 北京 18:10
    - cron: '10 12 * * 1-5'   # 北京 20:10
  workflow_dispatch:

permissions:
  contents: write   # 需写回 email/sent_dates.txt (去重标记)

concurrency:
  group: daily-mail
  cancel-in-progress: false

jobs:
  send-ratio-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 检到分支而非 detached HEAD, 否则后续 push 失败

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成并发送邮件 (纯标准库, 无需安装依赖)
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python email/send_ratio_email.py

      - name: 写回已发送记录 (幂等去重标记)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email/sent_dates.txt
          git diff --cached --quiet || git commit -m "chore: 记录已发送日期 $(TZ=Asia/Shanghai date +%F)"
          git push
