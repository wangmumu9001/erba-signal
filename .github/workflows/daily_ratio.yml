name: 二八择时日报

# 触发方式(两条并存, 靠幂等去重保证同一交易日只发一封):
#   1) 外部定时器(主力) —— 交易日北京 16:00 调 workflow_dispatch, 秒级启动, 时间精确
#   2) schedule —— GitHub 自带定时延迟大(实测 1h48m~6h11m)且偶尔整天丢档,
#                  故铺满全天每小时一次兜底, 外部定时器失效时靠它补发
#
# 数据口径: 发"最近一个已收盘交易日"的K线。
#   数据日期就是今天 → 必须已过 15:10;
#   数据日期早于今天 → 视为跨日补发(当天漏发时, 次日凌晨起仍能补上);
#   重复触发由 sent_dates.txt 幂等去重拦下。
on:
  schedule:
    # GitHub 的 cron 会推迟数小时才启动(实测 1h48m~6h11m, 且偶尔整天丢档)。
    # 授权后脚本支持跨日补发, 所以铺满全天每小时一次: 哪一次先成功就发哪次,
    # 其余因"该交易日已发送"被去重拦下。
    - cron: '20 * * * *'       # 全天每小时一次兜底
    - cron: '50 7-14 * * 1-5'  # 北京 15:50~22:50 加密, 争取当天晚上送达
  workflow_dispatch:

permissions:
  contents: write   # 需写回 email/sent_dates.txt (去重标记)

concurrency:
  group: daily-mail
  cancel-in-progress: false

jobs:
  send-ratio-email:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 检到分支而非 detached HEAD, 否则后续 push 失败

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 生成并发送邮件 (纯标准库, 无需安装依赖)
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python email/send_ratio_email.py

      - name: 写回已发送记录 (幂等去重标记)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add email/sent_dates.txt
          git diff --cached --quiet || git commit -m "chore: 记录已发送日期 $(TZ=Asia/Shanghai date +%F)"
          git push
