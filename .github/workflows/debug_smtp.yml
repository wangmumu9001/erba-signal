name: debug-smtp
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 探测 smtp.qq.com 对 AUTH 的反应(不使用真实账号)
        run: |
          python - <<'PY'
          import smtplib, base64, socket
          print("出口IP:", socket.gethostbyname("api.ipify.org") if False else "n/a")
          s = smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=30)
          print("greeting/noop:", s.noop())
          code, resp = s.ehlo()
          print("ehlo:", code)
          print("auth mechanisms:", s.esmtp_features.get("auth"))
          payload = base64.b64encode(b"\0nonexistent_probe_user@qq.com\0garbage").decode()
          try:
              print("AUTH 返回:", s.docmd("AUTH", "PLAIN " + payload))
          except Exception as e:
              print("AUTH 异常:", type(e).__name__, e)
          PY
